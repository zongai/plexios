name: Build unsigned IPA

on:
  # Manual only — default pushes do not build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for v in 16.4 16.3 16.2 16.1 16.0 15.4 15.3; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ ! -f "$(xcode-select -p)/usr/bin/xcodebuild" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project PlexiOS.xcodeproj

      - name: Resolve Swift packages (FFmpeg + MobileVLCKit)
        run: |
          xcodebuild -resolvePackageDependencies -project PlexiOS.xcodeproj -scheme PlexiOS

      - name: Build Release (unsigned)
        run: |
          set -euo pipefail
          # Stamp CFBundleVersion with Actions run number so About shows e.g. 0.1.0.b99
          xcodebuild \
            -project PlexiOS.xcodeproj \
            -scheme PlexiOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build


      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found under Release-iphoneos; listing products:"
            find build/DerivedData/Build/Products -maxdepth 4 -type d -name "*.app" || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="PlexiOS-unsigned-${{ github.run_number }}.ipa"
          zip -r "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plexios-unsigned-ipa
          path: PlexiOS-unsigned-*.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Unsigned IPA from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Not code-signed. Install via AltStore / Sideloadly / TrollStore, or re-sign with your team.
          files: PlexiOS-unsigned-*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
