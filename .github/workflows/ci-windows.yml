name: CI Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"

jobs:
  test:
    # User preference: do not run tests on push/build unless explicitly needed
    if: false
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests (decision engine)
        run: |
          dotnet restore tests/PlexWindows.Tests/PlexWindows.Tests.csproj
          dotnet test tests/PlexWindows.Tests/PlexWindows.Tests.csproj -c Release --verbosity minimal --no-restore

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore app
        run: dotnet restore src/PlexWindows/PlexWindows.csproj
      - name: Publish unpackaged self-contained win-x64
        run: |
          dotnet publish src/PlexWindows/PlexWindows.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o publish/win-x64
      - name: Verify exe
        run: |
          Get-ChildItem publish/win-x64 -Filter *.exe | Format-Table Name,Length
          if (-not (Test-Path publish/win-x64/PlexWindows.exe)) { throw "PlexWindows.exe missing" }
          # Native LibVLC must ship with unpackaged publish
          $libvlc = Get-ChildItem publish/win-x64 -Recurse -Filter libvlc.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libvlc) { throw "libvlc.dll missing from publish output — VideoLAN.LibVLC.Windows not copied" }
          Write-Host "Found $($libvlc.FullName)"
      - name: Upload exe folder
        uses: actions/upload-artifact@v4
        with:
          name: plex-windows-exe-x64
          path: PlexWindows/publish/win-x64/**
          if-no-files-found: error
