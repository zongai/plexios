name: PlexiOS
options:
  bundleIdPrefix: com.plexios
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  PlexiOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - InfoPlistNotes.md
      - path: App/Assets.xcassets
      - path: Core
      - path: Plex
      - path: Media
      - path: Features
      - path: UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app
        PRODUCT_NAME: PlexiOS
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  PlexiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PlexiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  PlexiOS:
    build:
      targets:
        PlexiOS: all
        PlexiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlexiOSTests
    archive:
      config: Release
