name: PlexiOS
options:
  bundleIdPrefix: com.plexios
  deploymentTarget:
    # Raised for SwiftVLC (libVLC 4) on feature/swiftvlc-migration — main stays iOS 17 until merge.
    iOS: "18.0"
  xcodeVersion: "26.4"
  objectVersion: 56
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # SwiftVLC 1.0 requires Swift 6.3+ / Xcode 26.4+.
    SWIFT_VERSION: "6.3"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  PlexFFmpeg:
    path: Vendor/PlexFFmpeg
  # Kept during migration; removed only after SwiftVLC path is fully verified.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"
  # Stable only — do not use 1.1.0-beta (XCFramework not release-qualified).
  SwiftVLC:
    url: https://github.com/harflabs/SwiftVLC.git
    from: "1.0.0"

targets:
  PlexiOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - InfoPlistNotes.md
      - path: App/Assets.xcassets
      - path: Core
      - path: Plex
      - path: Media
      - path: Features
      - path: IPTV
      - path: UI
      - path: Localization
        buildPhase: resources
    dependencies:
      - package: PlexFFmpeg
        product: PlexFFmpeg
      - package: VLCKitSPM
        product: VLCKitSPM
      - package: SwiftVLC
        product: SwiftVLC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app
        PRODUCT_NAME: PlexiOS
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        # USE_SWIFT_VLC enables the new backend stub; default path still MobileVLCKit until later phases.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG
        OTHER_LDFLAGS: "$(inherited) -lbz2 -lz -liconv"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG NATIVE_FFMPEG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG

  PlexiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PlexiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG

schemes:
  PlexiOS:
    build:
      targets:
        PlexiOS: all
        PlexiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlexiOSTests
    archive:
      config: Release
