name: PlexiOS
options:
  bundleIdPrefix: com.plexios
  deploymentTarget:
    # Raised on feature/swiftvlc-migration — main stays iOS 17 until merge.
    iOS: "18.0"
  # CI / GitHub macos-15 currently tops out at Xcode 26.3 (Swift 6.2.4).
  # SwiftVLC 1.0 needs tools 6.3 / Xcode 26.4+ — package is not linked until that is available.
  xcodeVersion: "26.3"
  objectVersion: 56
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Language mode 5.9 (same as main) under Xcode 26.3 SDK. Bump when linking SwiftVLC on 26.4+.
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  PlexFFmpeg:
    path: Vendor/PlexFFmpeg
  # Kept during migration; removed only after SwiftVLC path is fully verified.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"
  # SwiftVLC SPM intentionally omitted for Xcode 26.3 CI:
  #   from: "1.0.0" requires // swift-tools-version: 6.3
  # Re-add when runner / local has Xcode 26.4+ with Swift 6.3:
  #   SwiftVLC:
  #     url: https://github.com/harflabs/SwiftVLC.git
  #     from: "1.0.0"
  #   and target dependency product: SwiftVLC

targets:
  PlexiOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - InfoPlistNotes.md
      - path: App/Assets.xcassets
      - path: Core
      - path: Plex
      - path: Media
      - path: Features
      - path: IPTV
      - path: UI
      - path: Localization
        buildPhase: resources
    dependencies:
      - package: PlexFFmpeg
        product: PlexFFmpeg
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app
        PRODUCT_NAME: PlexiOS
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        # SwiftVLC backend compiles behind canImport(SwiftVLC); without the package it is a no-link stub.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG
        OTHER_LDFLAGS: "$(inherited) -lbz2 -lz -liconv"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG NATIVE_FFMPEG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG

  PlexiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PlexiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexios.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NATIVE_FFMPEG

schemes:
  PlexiOS:
    build:
      targets:
        PlexiOS: all
        PlexiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlexiOSTests
    archive:
      config: Release
