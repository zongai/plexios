name: CI Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests (decision engine)
        run: dotnet test tests/PlexWindows.Tests/PlexWindows.Tests.csproj -c Release --verbosity minimal

  # Full WinUI build requires Windows App SDK workload; keep optional on dispatch
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore PlexWindows.sln
      - name: Build
        run: dotnet build src/PlexWindows/PlexWindows.csproj -c Release -p:Platform=x64 --no-restore
