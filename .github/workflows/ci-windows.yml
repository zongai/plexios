name: CI Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "PlexWindows/**"
      - ".github/workflows/ci-windows.yml"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests (decision engine)
        run: dotnet test tests/PlexWindows.Tests/PlexWindows.Tests.csproj -c Release --verbosity minimal

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PlexWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore PlexWindows.sln
      - name: Publish unpackaged self-contained win-x64
        run: |
          dotnet publish src/PlexWindows/PlexWindows.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o publish/win-x64
      - name: Verify exe
        run: |
          Get-ChildItem publish/win-x64 -Filter *.exe | Format-Table Name,Length
          if (-not (Test-Path publish/win-x64/PlexWindows.exe)) { throw "PlexWindows.exe missing" }
      - name: Upload exe folder
        uses: actions/upload-artifact@v4
        with:
          name: plex-windows-exe-x64
          path: PlexWindows/publish/win-x64/**
          if-no-files-found: error
