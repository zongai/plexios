name: Build unsigned IPA

on:
  # Manual only — default pushes do not build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name outputs (branch-aware)
        id: meta
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          # Sanitize branch for filenames/tags (keep alnum, dot, underscore, hyphen).
          SLUG=$(echo "$REF" | sed 's#^feature/##' | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | cut -c1-48)
          RUN="${{ github.run_number }}"
          if [ "$REF" = "main" ]; then
            IPA="PlexiOS-unsigned-${RUN}.ipa"
            ARTIFACT="plexios-unsigned-ipa"
            TAG="build-${RUN}"
            TITLE="Build ${RUN}"
          else
            IPA="PlexiOS-unsigned-${SLUG}-${RUN}.ipa"
            ARTIFACT="plexios-unsigned-ipa-${SLUG}"
            TAG="build-${SLUG}-${RUN}"
            TITLE="Build ${RUN} (${REF})"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "IPA=$IPA ARTIFACT=$ARTIFACT TAG=$TAG"

      - name: Select Xcode
        run: |
          # Prefer Xcode 26.3 (current Actions max); 26.4 when available.
          for v in 26.3 26.4 26.2 26.1 26.0 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ ! -f "$(xcode-select -p)/usr/bin/xcodebuild" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version || true
          ls /Applications | grep -i xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # -list can resolve packages; do not fail the whole job solely on list noise —
          # formal resolve is the next step.
          xcodebuild -list -project PlexiOS.xcodeproj || true

      - name: Resolve Swift packages (FFmpeg + VLC + SwiftVLC)
        run: |
          xcodebuild -resolvePackageDependencies -project PlexiOS.xcodeproj -scheme PlexiOS

      - name: Build Release (unsigned)
        run: |
          set -euo pipefail
          # Stamp CFBundleVersion with Actions run number so About shows e.g. 0.1.0.b99
          xcodebuild \
            -project PlexiOS.xcodeproj \
            -scheme PlexiOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found under Release-iphoneos; listing products:"
            find build/DerivedData/Build/Products -maxdepth 4 -type d -name "*.app" || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="${{ steps.meta.outputs.ipa }}"
          zip -r "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          # Stable path for upload step
          echo "IPA_PATH=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.meta.outputs.ipa }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            Unsigned IPA from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - IPA: `${{ steps.meta.outputs.ipa }}`
            - Artifact: `${{ steps.meta.outputs.artifact }}`

            Not code-signed. Install via AltStore / Sideloadly / TrollStore, or re-sign with your team.
          files: ${{ steps.meta.outputs.ipa }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
