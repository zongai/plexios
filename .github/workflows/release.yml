name: Release multi-platform

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release
        working-directory: AndroidTV
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: release-androidtv
          path: AndroidTV/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        working-directory: PlexWindows
        run: dotnet test tests/PlexWindows.Tests/PlexWindows.Tests.csproj -c Release

  notes:
    runs-on: ubuntu-latest
    needs: [android, windows-tests]
    steps:
      - name: Summary
        run: |
          echo "## Release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android TV release APK: artifact **release-androidtv**" >> $GITHUB_STEP_SUMMARY
          echo "- Windows unit tests: passed (MSIX via scripts/pack-msix.ps1 or dispatch ci-windows)" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: dispatch **Build unsigned IPA** workflow" >> $GITHUB_STEP_SUMMARY
